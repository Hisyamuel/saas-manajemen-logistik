<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bursa Pengiriman (Vendor) - Kirlogist</title>
    <link rel="stylesheet" href="/frontend/css/styles.css">
    <link rel="stylesheet" href="/frontend/css/dashboard.css"> 
    <link rel="stylesheet" href="/frontend/css/vendor.css"> 
</head>

<body class="dashboard-body">
    <!-- Sidebar Navigasi Vendor -->
    <aside class="sidebar">
        <div class="sidebar-brand">Kirlogist</div>
        <nav class="sidebar-nav">
            <a href="vendor.html" class="nav-item active">Bursa Pengiriman</a>
            <a href="manajemen-supir.html" class="nav-item">Manajemen Supir</a>
            <a href="pengaturan-vendor.html" class="nav-item">Pengaturan</a>
        </nav>
        <div class="sidebar-footer">
            <a href="index.html" class="nav-item text-danger">Keluar</a>
        </div>
    </aside>

    <!-- Konten Utama -->
    <main class="main-content loader">
        <!-- Header Atas -->
        <header class="top-header">
            <div class="header-title">
                <h1>Job Board Vendor</h1>
            </div>

            <div class="header-actions">
                <div class="user-profile-dropdown">
                    <div class="user-profile">
                        <span class="user-role">Logistik Cepat CV</span>
                        <div class="avatar">L</div>
                    </div>
    
                    <!-- Isi Dropdown -->
                    <div class="dropdown-menu">
                        <div class="dropdown-header">
                            <strong>Admin Vendor</strong>
                            <span>admin@logistikcepat.com</span>
                        </div>
                        <hr class="dropdown-divider">
                        <a href="#" class="dropdown-item">Profil Saya</a>
                        <a href="#" class="dropdown-item">Ganti Akun</a>
                        <hr class="dropdown-divider">
                        <a href="index.html" class="dropdown-item text-danger">Keluar</a>
                    </div>
                </div>
                <!-- Hamburger Menu di posisi kanan atas untuk mobile -->
                <button class="mobile-menu-btn" aria-label="Buka Menu">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </header>

        <!-- ... (Kerangka Sidebar & Header sama seperti vendor.html) ... -->
            
            <form class="settings-form">
                <div class="input-group">
                    <label>Nama Perusahaan (Vendor)</label>
                    <input type="text" id="settingNamaVendor" value="Logistik Cepat CV">
                </div>
                
                <div class="input-group">
                    <label>Email Utama</label>
                    <input type="email" id="settingEmailVendor" value="admin@logistikcepat.com">
                </div>

                <div class="input-group">
                    <label>Area Jangkauan Operasional</label>
                    <textarea rows="3">Seluruh wilayah Kalimantan Timur (Samarinda, Balikpapan, Bontang, Kutai)</textarea>
                </div>

                <div class="input-group" style="display: flex; align-items: center; gap: 1rem; margin-top: 2rem;">
                    <input type="checkbox" id="notifOrder" checked style="width: auto; margin: 0;">
                    <label for="notifOrder" style="margin: 0; font-size: 0.95rem; color: var(--text-primary);">Kirim notifikasi email saat ada pekerjaan baru di Bursa</label>
                </div>

                <!-- Bagian Keamanan (Pindahan dari Modal) -->
                <h3
                    style="margin-top: 3rem; margin-bottom: 1.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 1.1rem;">
                    Keamanan Akun</h3>

                <div class="input-group">
                    <label for="oldPassword">Kata Sandi Saat Ini</label>
                    <input type="password" id="oldPassword" placeholder="Masukkan sandi lama">
                </div>
                <div class="input-group">
                    <label for="newPassword">Kata Sandi Baru</label>
                    <input type="password" id="newPassword" placeholder="Buat sandi baru">
                </div>

                <div style="margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.05);">
                    <button type="button" class="btn-primary small">Simpan Pengaturan</button>
                </div>
            </form>

    </main>

    <!-- =========================================
       Modal Profil Saya (Diperbarui)
    ========================================= -->
    <div id="profileModal" class="modal-overlay">
        <!-- max-width diperkecil menjadi 380px agar lebih ringkas -->
        <div class="modal-container" style="max-width: 380px;">
            <div class="modal-header">
                <h2>Profil Saya</h2>
                <button class="close-profile-btn icon-btn" aria-label="Tutup">&times;</button>
            </div>
            
            <div class="modal-body">
                <form id="profileForm">
                    <div class="avatar-edit-container">
                        <div class="avatar-large">L</div>
                        <button type="button" class="btn-outline small-pill">Ubah Foto</button>
                    </div>

                    <div class="input-group">
                        <label for="namaUser">Nama Lengkap (Admin)</label>
                        <!-- Nama disamakan agar konsisten -->
                        <input type="text" id="namaUser" value="Admin Vendor">
                    </div>
                </form>
            </div>
            
            <div class="modal-footer">
                <button type="button" class="btn-outline close-profile-btn">Batal</button>
                <button type="submit" form="profileForm" class="btn-primary small">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Script Vanilla JS untuk interaksi modal khusus Vendor -->
    <script src="/frontend/js/modal.js"></script>
    <script src="/frontend/js/session.js"></script>

</body>
</html>
